<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Default SEO tags, for crawlers and link previews that do not run JavaScript.
         Marked data-default-seo: src/main.jsx removes them before the app renders, and each
         page then sets its own through src/components/SEO.jsx, so the head never carries
         two descriptions. -->
    <!-- Primary Meta Tags -->
    <title data-default-seo>MALLOULIAUTO — Certification de véhicules d'occasion</title>
    <meta name="title" content="MALLOULIAUTO — Certification de véhicules d'occasion" />
    <meta data-default-seo
      name="description"
      content="Inspection avant achat de véhicules d'occasion en Tunisie, souvent appelée expertise avant achat : diagnostic électronique, kilométrage, épaisseur de peinture, pneus. Rapport vérifiable en ligne."
    />
    <meta
      name="keywords"
      content="certification véhicule occasion, certificat VO tunisie, expertise avant achat, expertise voiture occasion tunisie, diagnostic OBD, épaisseur peinture, contrôle technique partenaire, mallouliauto"
    />
    <!-- Open Graph / Facebook -->
    <meta data-default-seo property="og:type" content="website" />
    <meta data-default-seo property="og:url" content="https://mallouliauto.com/" />
    <meta data-default-seo property="og:title" content="MALLOULIAUTO — Certification de véhicules d'occasion" />
    <meta data-default-seo
      property="og:description"
      content="Prouvez l'état réel d'un véhicule d'occasion. Certificat vérifiable en ligne, rédigé par un opérateur indépendant."
    />
    <meta data-default-seo
      property="og:image"
      content="https://mallouliauto.com/images/og-share.jpg"
    />
    <meta data-default-seo property="og:image:width" content="1200" />
    <meta data-default-seo property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta data-default-seo name="twitter:card" content="summary_large_image" />
    <meta data-default-seo name="twitter:url" content="https://mallouliauto.com/" />
    <meta data-default-seo name="twitter:title" content="MALLOULIAUTO — Certification de véhicules d'occasion" />
    <meta data-default-seo
      name="twitter:description"
      content="Prouvez l'état réel d'un véhicule d'occasion — certificat vérifiable en ligne."
    />
    <meta data-default-seo
      name="twitter:image"
      content="https://mallouliauto.com/images/og-share.jpg"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Design system typography: Montserrat (display/body) + IBM Plex Mono (data/identifiers) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />

    <!-- EasyMDE Markdown Editor -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>
