<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <clipPath id="dealer-disc">
      <circle cx="200" cy="200" r="78"/>
    </clipPath>
  </defs>

  <!-- Navy background -->
  <rect width="400" height="400" fill="#263f4f"/>

  <!-- White inner disc -->
  <circle cx="200" cy="200" r="78" fill="#fff"/>

  <!-- Figure clipped inside the disc -->
