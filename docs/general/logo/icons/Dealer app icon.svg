    <!-- Orange head -->
    <circle cx="200" cy="164" r="34" fill="#ee7749"/>
    <!-- Orange torso / shoulders -->
    <path d="M124,272 C124,228 158,200 200,200 C242,200 276,228 276,272 L276,310 L124,310 Z" fill="#ee7749"/>
    <!-- White tie — modern: knot + tapered blade with point -->
    <path d="M194,198 L206,198 L210,212 L206,218 L216,266 L200,294 L184,266 L194,218 L190,212 Z" fill="#fff"/>
  </g>

